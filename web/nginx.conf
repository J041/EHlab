events {}

http {
    server_tokens on;

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html/default;

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 80;
        server_name www.lab.local;
        root /usr/share/nginx/html/www;

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 80;
        server_name dev.lab.local;
        root /usr/share/nginx/html/dev;

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 80;
        server_name login.lab.local;
        root /usr/share/nginx/html/login;

        location = /login {
            proxy_pass http://auth:9000/login;
            proxy_set_header Host $host;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 8443;
        server_name _;
        root /usr/share/nginx/html/admin;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
