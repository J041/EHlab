<!doctype html>
<html>
<head>
    <title>Legacy Admin Portal</title>
    <style>
        body { font-family: sans-serif; max-width: 520px; margin: 60px auto; }
        input { display:block; width:100%; padding:10px; margin:8px 0; }
        button { padding:10px 18px; }
    </style>
</head>
<body>
    <h1>Legacy Admin Portal</h1>
    <p>Authorized training environment.</p>
    <form method="POST" action="/login">
        <label>Username</label>
        <input name="username" autocomplete="off">
        <label>Password</label>
        <input name="password" type="password">
        <button type="submit">Login</button>
    </form>
    <hr>
    <small>Legacy system v1.4</small>
</body>
</html>
